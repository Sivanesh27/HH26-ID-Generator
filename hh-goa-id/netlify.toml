[build]
  publish = "."
  functions = "netlify/functions"

# Clean share-link URL: /s/<id>  ->  serves an HTML page with the correct
# Open Graph / Twitter Card meta tags pointing at the generated badge, so
# link previews (including on X) show the actual graphic.
[[redirects]]
  from = "/s/:id"
  to = "/.netlify/functions/share-page?id=:id"
  status = 200
  force = true

# Clean image URL: /img/<id>  ->  serves the raw PNG bytes for that badge.
# This is the URL used as og:image / twitter:image on the share page above.
[[redirects]]
  from = "/img/:id"
  to = "/.netlify/functions/share-image?id=:id"
  status = 200
  force = true
